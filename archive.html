<!DOCTYPE html>
<!--
  档案馆（原"画廊页"）· 展示整团的角色卡墙，只读浏览
  依据：PRD 验收 #1（3 秒内看到卡片墙，无角色时显示引导文案）
  数据来源：云端 characters 表
  说明：这一页就是发给全团的"浏览链接"，只读、不需要口令
  Day 9 改动：从独立首页收编为「档案馆」分页，顶部加了全站导航栏。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>档案馆 · 跑团角色卡档案馆</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="archive">
  <header class="top-bar">
    <h1>档案馆</h1>
    <p class="sub-text">全团角色卡集中在这，点开看详情</p>
  </header>

  <!-- 全站导航栏（五页共用，每页都一样；当前页靠 nav.js 高亮） -->
  <nav class="site-nav">
    <ul>
      <li><a href="index.html" data-nav="intro">介绍</a></li>
      <li><a href="rules.html" data-nav="rules">规则资源</a></li>
      <li><a href="create.html" data-nav="create">创建角色</a></li>
      <li><a href="archive.html" data-nav="archive">档案馆</a></li>
      <li><a href="play.html" data-nav="play">跑团</a></li>
    </ul>
  </nav>

  <main class="page-box">
    <!-- 状态提示区：显示"正在读取""读取失败"等信息 -->
    <div id="message-box"></div>

    <!-- 筛选栏（Day 12 新增）：关键字 + 职业两个条件。
         筛选只在前端已有的数据上做过滤，不重新请求云端（快，也不浪费流量）。
         这里所有 id 都按 .workbuddy/skills/filter-check/SKILL.md 里的
         "固定 id 契约"来起名——名字统一，检查脚本才认得出这些部件。 -->
    <div class="filter-bar" id="filter-bar">
      <div class="filter-field">
        <label class="filter-label" for="filter-keyword">关键字</label>
        <input type="search" id="filter-keyword" placeholder="搜名字 / 简介"
               aria-label="按名字或简介搜索角色卡">
      </div>
      <div class="filter-field">
        <label class="filter-label" for="filter-class">职业</label>
        <select id="filter-class" aria-label="按职业筛选角色卡">
          <option value="">全部职业</option>
        </select>
      </div>
      <button type="button" class="btn" id="filter-reset"
              aria-label="清空筛选条件，显示全部角色卡">清空筛选</button>
      <!-- 结果计数：role=status + aria-live 让读屏软件也能念出"筛出了多少" -->
      <p class="filter-count" id="filter-count" role="status" aria-live="polite"></p>
    </div>

    <!-- 无结果的空状态：有卡但筛不到时出现。
         不能只留一片空白——那样用户会以为页面坏了。
         提示里给出"清空筛选"的出口，用户一步就能回到全部。 -->
    <div class="empty-tip" id="filter-empty" hidden>
      <p>没有符合条件的角色卡。</p>
      <p class="sub-text">换个关键字、换个职业，或者清空条件看全部。</p>
      <p><button type="button" class="btn" id="filter-empty-reset">清空筛选</button></p>
    </div>

    <!-- 画廊墙：角色卡一张张排在这里，内容由 app.js 从云端读出后填进来 -->
    <div class="card-wall" id="card-wall"></div>

    <!-- 这里没有"添加角色"按钮：
         创建角色走顶部导航的「创建角色」分页（create.html）。
         档案馆定位是"展示页"，只读，不发入口混进管理功能。 -->
  </main>

  <footer class="bottom-bar">
    <p>跑团角色卡档案馆 · 档案馆页</p>
  </footer>

  <!-- 云服务 SDK：从本地文件引入（本项目没有构建步骤，所以用 <script> 方式）
       为什么不走在线 CDN：实测外部 CDN 偶尔会返回"空响应"，
       那样 SDK 就没加载出来，整页会显示"读不到角色卡"。
       存一份在本地方便离线开发，页面也不再受网络波动影响。 -->
  <script src="vendor/workbuddy-cloud-sdk.js"></script>
  <!-- 云服务公开配置：下面两个值来自开通云服务时返回的 publicConfig -->
  <script src="cloud-config.js"></script>
  <!-- 页面自己的脚本，最后引入，保证前面的东西都已就位 -->
  <script src="app.js"></script>
  <!-- 导航高亮脚本 -->
  <script src="nav.js"></script>
</body>
</html>
